# ==============================================================================
# SEPARATE YAML CONFIGURATION FOR THE DECOUPLED FLUID BACKGROUND MODEL
# ==============================================================================

theory:
  # 1. Load the independent native background tracker class
  custom_fluid.CustomStageIVBoltzmannEngine:
    python_path: .
   
  # 2. Maintain vanilla CAMB cleanly for un-collapsed perturbation functions
  camb:
    path: /opt/cosmology/modules/CAMB
    stop_at_error: False
    extra_args:
      lens_potential_accuracy: 2
      halofit_version: mead2020

params:
  # ============================================================================
  # Custom Background Grid Sampling Priors
  # ============================================================================
  alpha_fluid:
    prior: {min: -0.4, max: 0.4}
    ref: 0.0
    proposal: 0.01
    latex: \alpha_{\rm fluid}
  z_decay:
    prior: {min: 0.5, max: 3.5}
    ref: 1.5
    proposal: 0.1
    latex: z_{\rm decay}

# Change output target paths to protect your baseline ΛCDM file histories
output: chains/fluid_background_run/probe_matrix

 
